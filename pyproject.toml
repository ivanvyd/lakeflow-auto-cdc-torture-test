[project]
name = "lakeflow-auto-cdc-torture-test"
version = "0.1.0"
description = "Adversarial CDC scenarios for Lakeflow AUTO CDC. Nine scenarios, deterministic assertions, evidence-driven article."
requires-python = ">=3.10"
authors = [
    { name = "Ivan Vydrin" },
]
dependencies = [
    "databricks-sdk>=0.20.0",
    "delta-spark>=3.0.0",
    "matplotlib>=3.8.0",
    "pyspark>=3.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
namespaces = false

[tool.ruff]
line-length = 100
target-version = "py310"
